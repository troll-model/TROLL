name: Website

# Builds the pkgdown website (site/) with the Doxygen API reference, and publishes it
# to GitHub Pages: https://troll-model.github.io/TROLL/
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and Doxygen
        run: sudo apt-get install -y cmake libgsl-dev doxygen

      - name: API reference (Doxygen)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target docs

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install pkgdown
        run: Rscript -e 'install.packages(c("pkgdown", "rmarkdown"))'

      - name: Build the website
        run: site/build.sh --api build/docs/html

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/docs

  deploy:
    # publish only from dev and version tags, not from pull requests
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
