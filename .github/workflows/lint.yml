name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cppcheck cpplint

      - name: Configure CMake
        run: cmake -B lint -S lint

      # Gating: cppcheck warnings fail the job (previously "|| true" let everything pass)
      - name: cppcheck (gating)
        run: cmake --build lint --target lint-static-gate

      # Advisory: full style/static reports are kept as artifacts but do not fail the job
      - name: cpplint (advisory)
        run: cmake --build lint --target lint-style > cpplint_output.txt 2>&1 || true

      - name: cppcheck --enable=all (advisory)
        run: cmake --build lint --target lint-static > cppcheck_output.txt 2>&1 || true

      - name: Upload lint outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-outputs
          path: |
            cpplint_output.txt
            cppcheck_output.txt
